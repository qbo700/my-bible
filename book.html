<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正在播放</title>
    <style>
        body { font-family: sans-serif; background: #f7f9fa; padding: 20px; }
        .box { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; flex-wrap: wrap; }
        .info { flex: 1; font-weight: bold; color: #555; min-width: 80px; }
        audio { flex: 3; height: 32px; min-width: 200px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h2 id="title">加载中...</h2>
            <a href="index.html" style="color:#27ae60; text-decoration:none; font-weight:bold;">⬅ 返回目录</a>
        </div>
        <div id="list"></div>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const id = p.get('id'), name = p.get('name'), count = parseInt(p.get('count'));
        document.title = name;
        document.getElementById('title').innerText = name;
        const list = document.getElementById('list');
        for (let i = 1; i <= count; i++) {
            let num = i < 10 ? '0' + i : i;
            // 💡 关键：自动拼接你的分仓库地址
            let url = `https://qbo700.github.io/bible-${id}/audio/chap${num}.mp3`;
            list.innerHTML += `
                <div class="item">
                    <div class="info">第 ${num} 章</div>
                    <audio controls src="${url}" preload="none"></audio>
                </div>`;
        }
    </script>
    <script data-goatcounter="https://qbo700.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
