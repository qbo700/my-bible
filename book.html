<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放页 - 圣经音库</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fdfdfd; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 400px; text-align: center; padding: 30px; border: 1px solid #d2d2d7; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: white; }
        h2 { font-weight: 600; margin-bottom: 20px; color: #1d1d1f; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7; font-size: 16px; margin-bottom: 15px; background: #f5f5f7; }
        
        /* 改进的按钮样式 */
        .btn-play { 
            width: 100%; padding: 12px; background-color: #0071e3; color: white; border: none; 
            border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 15px;
        }
        .btn-play:active { background-color: #005bb7; }
        
        audio { width: 100%; margin-top: 10px; }
        .nav { margin-bottom: 25px; display: block; text-decoration: none; color: #0071e3; font-size: 15px; }
        #info { color:#86868b; font-size:13px; margin-top:15px; min-height: 1.2em; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html" class="nav">《 返回目录</a>
        <h2 id="bookName">书卷加载中...</h2>
        
        <select id="chapterSelect" onchange="initAudio()"></select>
        
        <button id="playBtn" class="btn-play" onclick="manualPlay()">点击播放 / 重试</button>
        
        <audio id="ap" controls></audio>
        
        <p id="info"></p>
    </div>

    <script>
        const p = new URLSearchParams(window.location.search);
        const name = p.get('name');
        const total = parseInt(p.get('chapters'));
        const folder = p.get('folder');

        document.getElementById('bookName').innerText = name;
        const sel = document.getElementById('chapterSelect');
        const info = document.getElementById('info');
        const audio = document.getElementById('ap');

        // 初始化章节下拉框
        for(let i=1; i<=total; i++) {
            let o = document.createElement('option');
            let v = i.toString().padStart(2, '0');
            o.value = v; o.innerText = `第 ${i} 章`;
            sel.appendChild(o);
        }

        // 切换章节时调用的函数
        function initAudio() {
            const c = sel.value;
            // 重要：这里是关键！如果音频在 T1，你需要一个能访问到 T1 的地址。
            // 如果你在家内网使用，可以用 T1 的内网 IP，如 http://192.168.1.19/audio/...
            // 如果你在外网使用，这里需要填你的 Cpolar 映射地址或者 T1 的直连地址。
            const src = `./audio/${folder}/${name}${c}.mp3`; 
            
            audio.src = src;
            audio.load(); // 强制加载新资源
            info.innerText = `已准备: ${name} 第 ${c} 章`;
            info.className = ""; 
        }

        // 按钮点击播放
        function manualPlay() {
            info.innerText = "正在尝试加载音频...";
            audio.play().then(() => {
                info.innerText = "正在播放: " + name + " 第 " + sel.value + " 章";
                info.className = "";
            }).catch(e => {
                console.error("播放失败:", e);
                info.innerText = "播放失败！请检查 T1 是否在线或链接是否正确";
                info.className = "error";
            });
        }

        // 监听错误，不锁死页面
        audio.onerror = function() {
            info.innerText = "文件读取失败，请点击按钮重试";
            info.className = "error";
        };

        window.onload = initAudio;
    </script>
</body>
</html>
