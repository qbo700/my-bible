<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放 - 圣经音库</title>
    <style>
        /* 保持你最喜欢的原版简约风格 */
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { width: 90%; max-width: 400px; text-align: center; padding: 30px; border: 1px solid #d2d2d7; border-radius: 20px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { font-weight: 600; margin-bottom: 20px; color: #1d1d1f; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d2d2d7; font-size: 16px; margin-bottom: 20px; outline: none; background: #f5f5f7; }
        
        /* 这里的方块播放按钮：你可以重复点击它 */
        .play-btn { 
            width: 100%; padding: 15px; background-color: #0071e3; color: white; border: none; 
            border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px;
        }
        .play-btn:active { background-color: #005bb7; }
        
        audio { width: 100%; }
        .nav { margin-bottom: 30px; display: block; text-decoration: none; color: #0071e3; font-size: 14px; }
        #status { color:#86868b; font-size:12px; margin-top:15px; }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html" class="nav">《 返回目录</a>
        <h2 id="bookName">书卷加载中...</h2>
        
        <select id="chapterSelect" onchange="prepareAudio()"></select>
        
        <button class="play-btn" onclick="manualPlay()">点击播放 / 重试</button>
        
        <audio id="ap" controls></audio>
        <p id="status"></p>
    </div>

    <script>
        // 获取 index.html 传过来的参数
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "未知";
        const total = parseInt(params.get('chapters')) || 1;
        const folder = params.get('folder') || "";

        document.getElementById('bookName').innerText = name;
        const sel = document.getElementById('chapterSelect');
        const audio = document.getElementById('ap');
        const status = document.getElementById('status');

        // 1. 立即生成下拉框，确保它不会不见
        for(let i=1; i<=total; i++) {
            let o = document.createElement('option');
            let v = i.toString().padStart(2, '0');
            o.value = v; o.innerText = `第 ${i} 章`;
            sel.appendChild(o);
        }

        // 2. 准备音频（切换章节时调用）
        function prepareAudio() {
            const chap = sel.value;
            // 路径：audio/文件夹/书名01.mp3
            audio.src = `./audio/${folder}/${name}${chap}.mp3`;
            audio.load(); // 强制加载，清理缓存
            status.innerText = "已就绪，等待播放";
        }

        // 3. 核心功能：手动播放/重试按钮
        function manualPlay() {
            // 如果还没加载地址（比如刚打开页面），先加载一下
            if (!audio.src || audio.src === window.location.href) {
                prepareAudio();
            }
            
            status.innerText = "正在尝试播放...";
            
            // 尝试播放并捕获错误
            audio.play().then(() => {
                status.innerText = "正在播放: " + name + " 第 " + sel.value + " 章";
            }).catch(e => {
                console.log("播放失败，可再次点击按钮重试");
                status.innerText = "播放未成功，请检查文件或再次点击重试";
            });
        }

        // 页面初始化
        window.onload = prepareAudio;
    </script>
</body>
</html>
