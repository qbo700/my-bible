<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聆听圣言</title>
    <style>
        :root { --primary: #5d4037; --accent: #27ae60; --bg: #f8f9fa; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: var(--bg); margin: 0; padding: 12px; }
        .box { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f1f1; padding-bottom: 15px; margin-bottom: 25px; }
        .header h2 { font-size: 1.7rem; color: var(--primary); margin: 0; }
        .back-btn { font-size: 1rem; color: #7f8c8d; text-decoration: none; border: 1.5px solid #dcdfe6; padding: 6px 18px; border-radius: 30px; font-weight: bold; }
        .chapter-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .chapter-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); display: block; margin-bottom: 15px; border-left: 5px solid var(--accent); padding-left: 12px; }
        audio { width: 100%; height: 55px; margin-bottom: 15px; }
        .dl-bar { background: var(--accent); color: white; text-decoration: none; display: block; text-align: center; 
                 padding: 18px; border-radius: 12px; font-weight: bold; font-size: 1.2rem; transition: 0.2s; }
        .dl-bar:active { background: #219150; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h2 id="title">加载中</h2>
            <a href="index.html" class="back-btn">返回目录</a>
        </div>
        <div id="list"></div>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const id = p.get('id'), name = p.get('name'), count = parseInt(p.get('count'));
        document.getElementById('title').innerText = name;
        const list = document.getElementById('list');
        for (let i = 1; i <= count; i++) {
            let num = i < 10 ? '0' + i : i;
            let url = `https://qbo700.github.io/bible-${id}/audio/chap${num}.mp3`;
            list.innerHTML += `
                <div class="chapter-card">
                    <span class="chapter-title">第 ${i} 章</span>
                    <audio controls src="${url}" preload="none"></audio>
                    <a href="${url}" download="${name}-第${num}章.mp3" class="dl-bar">📥 下载本章 MP3 音频</a>
                </div>`;
        }
    </script>
</body>
</html>
