<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在播放</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f7f9fa; margin: 0; padding: 10px; }
        .box { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .header h2 { font-size: 1.4rem; color: #333; margin: 0; }
        .back-btn { font-size: 1.1rem; color: #27ae60; text-decoration: none; font-weight: bold; padding: 5px; }
        .item { padding: 20px 0; border-bottom: 1px solid #f0f0f0; }
        .info { font-size: 1.2rem; font-weight: bold; color: #444; margin-bottom: 10px; display: block; }
        audio { width: 100%; height: 45px; } /* 播放器更大更长 */
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <h2 id="title">加载中</h2>
            <a href="index.html" class="back-btn">返回</a>
        </div>
        <div id="list"></div>
    </div>
    <script>
        const p = new URLSearchParams(window.location.search);
        const id = p.get('id'), name = p.get('name'), count = parseInt(p.get('count'));
        document.getElementById('title').innerText = name;
        const list = document.getElementById('list');
        for (let i = 1; i <= count; i++) {
            let num = i < 10 ? '0' + i : i;
            let url = `https://qbo700.github.io/bible-${id}/audio/chap${num}.mp3`;
            list.innerHTML += `
                <div class="item">
                    <span class="info">第 ${i} 章</span>
                    <audio controls src="${url}" preload="none"></audio>
                </div>`;
        }
    </script>
</body>
</html>
